<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Panel · Offcourt Sports Group</title>
    <script>
      // El tema se aplica ANTES de que React monte: si esperara al primer
      // render, se vería un fogonazo claro antes de pasar a oscuro. Sigue al
      // sistema mientras no haya una elección guardada (ver src/admin/tema.ts).
      (function () {
        try {
          var g = localStorage.getItem('oc-tema-panel');
          var oscuro = g === 'oscuro' || (!g && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', oscuro);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/admin/main.tsx"></script>
  </body>
</html>
